# This change carries no spec delta. See no-spec-delta.md, beside this file, for
# why -- NOT specs/README.md: the validator counts every file under specs/ as a
# delta, so an explanation placed there turns the change red.
#
# `skip_specs` is only honoured when this file is valid change metadata, which
# requires `schema` naming a resolvable schema -- without it the marker is read,
# rejected and the change fails `openspec validate --strict` exactly as if the
# marker were absent.
schema: spec-driven
skip_specs: true
