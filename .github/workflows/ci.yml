name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The gate's sixth command is `bash scripts/typecheck_ui.sh`, which runs
      # `vue-tsc --noEmit` and refuses by name without `ui/node_modules/`. On an
      # operator's machine that directory is restored by hand, deliberately --
      # `npm install` fetches third-party packages and nothing in this
      # repository does it silently. CI is the one place it must be restored
      # automatically, and `npm ci` from the tracked `ui/package-lock.json` is
      # the deterministic way to do it: it installs exactly the pinned tree and
      # fails rather than resolving a new one.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the browser toolchain
        run: npm ci
        working-directory: ui

      # The gate is declared once, as the `gate` array in .minions/minions.toml,
      # and mirrored by the root Makefile. CI invokes that mirror rather than
      # keeping a third copy: these steps had already drifted, running
      # `ruff format --check` and `ruff check` without the `.` the array names.
      - name: Gate
        run: make gate
