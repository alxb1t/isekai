name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.19"
          enable-cache: true

      # The gate's fifth command is `bash tools/typecheck_ui.sh`, which runs
      # `vue-tsc --noEmit` and refuses by name without `ui/node_modules/`. On an
      # operator's machine that directory is restored by hand, deliberately --
      # `npm install` fetches third-party packages and nothing in this
      # repository does it silently. CI is the one place it must be restored
      # automatically, and `npm ci` from the tracked `ui/package-lock.json` is
      # the deterministic way to do it: it installs exactly the pinned tree and
      # fails rather than resolving a new one.
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the browser toolchain
        run: npm ci
        working-directory: ui

      # The gate is the Makefile's `gate` target. CI runs it rather than keeping
      # its own copy of the commands, which would drift.
      # CI fetches nothing from Hugging Face, so it declares the vocabulary absent
      # and the checks that read it skip; anywhere else they fail without it.
      - name: Gate
        run: make gate
        env:
          ISEKAI_VOCABULARY: absent
