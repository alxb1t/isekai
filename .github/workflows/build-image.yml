name: build-image

# A push to `main` publishes `:latest` — that is the released image, and it is the
# only thing that may claim that tag. A manual run publishes whatever tag you name
# and defaults to a release candidate, so a pre-release build (a metered phase that
# needs the branch's image on a pod, before the branch is merged) can never clobber
# the image a rollback would reach for.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish — a release candidate, never `latest`
        required: true
        default: v0.11-rc

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The header above asserts a protection the workflow did not enforce: a
      # `workflow_dispatch` string went straight into `tags`, so a manual run
      # naming `latest` clobbered the released image, and a newline in the input
      # would have been honoured as a second tag by the action's newline-separated
      # `tags` field. Validate before use, and let the build step read a step
      # output so the raw input is never interpolated into `tags` at all.
      - name: Resolve and validate the image tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "workflow_dispatch" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REQUESTED" = "latest" ]; then
            echo "::error::'latest' is the released image; only a push to main may claim it."
            exit 1
          fi
          case "$REQUESTED" in
            '' | *[!A-Za-z0-9._-]*)
              echo "::error::tag must match ^[A-Za-z0-9._-]+\$"
              exit 1
              ;;
          esac
          echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/alxb1t/isekai:${{ steps.tag.outputs.tag }}
