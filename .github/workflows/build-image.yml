name: build-image

# Built on request only: every image that exists was asked for, and its digest is
# in the run's summary. A pod boots that digest from `config/image.json`, never a
# tag, so `latest` is refused rather than published (0033 design D2, D3).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish — a release candidate, never `latest`
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # A newline in the input would be honoured as a second tag by the action's
      # newline-separated `tags` field. Validate before use, and let the build
      # step read a step output so the raw input is never interpolated into `tags`.
      - name: Resolve and validate the image tag
        id: tag
        env:
          REQUESTED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = "latest" ]; then
            echo "::error::a pod boots a digest, never 'latest'; name a release candidate."
            exit 1
          fi
          case "$REQUESTED" in
            '' | *[!A-Za-z0-9._-]*)
              echo "::error::tag must match ^[A-Za-z0-9._-]+\$"
              exit 1
              ;;
          esac
          echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ghcr.io/alxb1t/isekai:${{ steps.tag.outputs.tag }}

      # The digest is the pin `config/image.json` takes; the tag is only a label.
      - name: Report the digest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Image: ghcr.io/alxb1t/isekai:${TAG}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
