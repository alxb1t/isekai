# The render session's GPU, read by gpunit when `isekai render` opens a session.
# `image` is `config/image.json`'s reference and digest; a test holds them equal.
project = "isekai"
image = "ghcr.io/alxb1t/isekai@sha256:21b715d99bdd2b5d2452275533366e43e7e2b6fcfd048d08a65e9e7ebd9a1d3f"
gpus = [
    "NVIDIA RTX PRO 4500 Blackwell",
    "NVIDIA L4",
    "NVIDIA GeForce RTX 4090",
    "NVIDIA A40",
    "NVIDIA RTX PRO 6000 Blackwell Workstation Edition",
]
vram_gb = 24
ram_gb = 24
cuda = "12.8"
disk_gb = 30
ports = [8188]
# The hard maximum on a session; each session stops at its own limit, the work's
# estimate, which `isekai render` hands gpunit as its ceiling (D3).
ceiling = "3h"
timeout = 420
# gpunit refuses a card dearer than this per hour, so a quote at it is a bound (D4).
max_hourly = 0.90
# The models volume of a working window: `gpunit volume up` makes it, in a data
# centre stock chooses, and `gpunit volume down` deletes it. Past the ceiling, it
# bills until gpunit's next session, up, status, down, volume up or volume down
# sweeps it, if that delete succeeds.
volume_gb = 50
volume_ceiling = "4h"
