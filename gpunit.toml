# The render session's GPU, read by gpunit when `isekai render` opens a session.
# `image` is `config/image.json`'s reference and digest; a test holds them equal.
project = "isekai"
image = "ghcr.io/alxb1t/isekai@sha256:0f0a8e82dbeb5d7059353ed289f5d414bd9977905de9f7c38923e2abbdcf88ff"
gpus = [
    "NVIDIA RTX PRO 4500 Blackwell",
    "NVIDIA L4",
    "NVIDIA GeForce RTX 4090",
    "NVIDIA A40",
    "NVIDIA RTX PRO 6000 Blackwell Workstation Edition",
]
vram_gb = 24
ram_gb = 24
cuda = "12.8"
disk_gb = 30
ports = [8188]
ceiling = "45m"
timeout = 420
# The models volume of a working window: `gpunit volume up` makes it, in a data
# centre stock chooses, and `gpunit volume down` or its ceiling deletes it.
volume_gb = 50
volume_ceiling = "4h"
