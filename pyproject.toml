[project]
name = "isekai"
version = "0.21.0"
requires-python = ">=3.12"
dependencies = []

# The evaluator's stack, and NOT the runtime's. `python -m isekai` keeps
# `dependencies = []` above, held by a test that imports it with site-packages
# off the path -- an evaluator is not a way to render at all, and the entry gate
# is about what may be selected to render.
#
# CI never installs this. The eval tests skip there and run on the operator's
# machine, which is the same posture this repository already takes toward
# diffusion quality: verified by eye on a pod, never in CI. This extra adds no
# gate command -- the array is six, and none of them installs it.
#
# Five packages, and each one is load-bearing:
#   torch, transformers -- StyleID publishes only a CLIPModel safetensors, and
#     the DWPose artifact `models.json` pins is a TorchScript `.pt`. There is no
#     ONNX route to either, so this is not a convenience.
#   onnxruntime -- MIT, and what the region parser and the anime-face detector
#     are loaded through. Loading weights is not linking code, which is what
#     keeps the detector's copyleft question closed (design.md D19).
#   numpy, Pillow -- arrays, and the loader's orientation transpose. The header
#     parser returns dimensions; the scorer has to transpose the pixels itself.
#
# Deliberately absent: `ultralytics`, asserted by a test rather than left to a
# licence review nobody runs. `scipy`/`scikit-image` are absent too -- CIEDE2000
# and Spearman are closed-form, are implemented in-tree against their published
# formulas, and are unit-tested against published reference data.
[project.optional-dependencies]
eval = [
    "torch>=2.6",
    "transformers>=4.49",
    "onnxruntime>=1.20",
    "numpy>=2.1",
    "Pillow>=11.0",
]

# The local tagger's stack, and NOT the runtime's. `dependencies = []` above is
# untouched and so is the `-S` guard: this extra is imported from exactly one
# module, the tagger's own boundary, and function-locally there -- the same
# shape the `ui` extra takes, which `cli.py` imports inside its handler.
#
# Three packages, and it is deliberately NOT the `eval` extra even though that
# one already resolves all three. `eval` also carries `torch>=2.6` and
# `transformers>=4.49` -- roughly 2 GB that this tagger never imports -- and
# installing a measurement stack to read a 467 MB ONNX graph would make the
# cheap half of stage ③ cost the expensive half's download (design.md D19). The
# `ui` extra is the precedent: a narrow extra for one surface.
#
# Floored rather than pinned, matching `eval` and not `ui`: these are the floors
# the tagger needs, and the pins the lockfile already carries were resolved for
# `eval` from the same three names, so `uv sync --locked` -- gate command one --
# stays green without a new resolution.
#
#   onnxruntime -- the SwinV2 session `models/wd14/model.onnx` is loaded through.
#   numpy       -- the prepared array in and the probability vector out.
#   Pillow      -- open, composite onto white, pad to a square, resize.
tagging = [
    "onnxruntime>=1.20",
    "numpy>=2.1",
    "Pillow>=11.0",
]

# The review surface's server, and NOT the runtime's. `dependencies = []` above
# stays empty and stays held by the test that imports the package with
# site-packages off the path: `python -m isekai` is stdlib-only, and the `ui`
# handler in `cli.py` imports this tree INSIDE the function so the import-graph
# guard never sees it.
#
# It is NOT how the gate gets FastAPI. The `dev` dependency group below pins the
# same two packages, so `uv sync --locked` installs them and `tests/test_ui_api.py`
# actually runs; the two pin lists are held equal by a test. That is also why
# `isekai/interface/ui/app.py` needs no `[[tool.ty.overrides]]` block the way
# `eval_backends.py` does -- the import resolves in the environment the gate runs
# in, so there is nothing to ignore.
#
# Two packages, both explicit. `fastapi[standard]` would pull a much wider tree
# -- an HTTP client, a CLI, email validation, templating -- for one server bound
# to 127.0.0.1 that serves six endpoints and a built bundle.
#
# Pinned exactly rather than floored, unlike `eval` above. The difference is what
# the two extras are for: `eval` is a measurement stack whose floors state what
# the scorer needs, while this is a private localhost tool whose whole job is to
# be the same surface every time the operator opens it -- an unannounced minor
# that changes a response shape is a defect in the middle of a review session,
# and there is no CI run that would catch it first.
ui = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

# Test and gate tooling only, and NOT runtime: `uv sync --locked` installs this
# group by default, so everything here is present for all six gate commands and
# for none of `python -m isekai`. `dependencies = []` above is untouched, and the
# stdlib-only runtime rule with it.
#
# `httpx2` is here rather than in the `ui` extra above because it is a test
# client, not a server dependency: it is what starlette's `TestClient` requires,
# and shipping it to anyone who installs the extra to actually serve the surface
# would be wrong about what it is for.
#
# `fastapi` and `uvicorn` are here TOO, duplicating the extra's pins, and that
# duplication is the point rather than an oversight. Four `ui` scenarios are
# bound only inside `tests/test_ui_api.py`, which drives the real HTTP surface
# and so cannot fake its boundary the way the eval tests fake theirs. While the
# extra was the only place FastAPI lived, gate command one never installed it,
# the module's `importorskip` fired, and those four scenarios were proved by a
# test that never ran -- a binding that looks exactly like a binding and binds
# nothing, which is the failure the marker-registration rule exists to prevent.
# A dev group entry makes the gate run them. The extra stays, because an
# operator who only wants to serve the surface should not install a test client
# and a test runner to do it; the two pins are held equal by a test.
#
# Every version here is pinned exactly, for the extra's own reason: the surface
# must be the same every time the operator opens it, and an unannounced minor
# that changes a response shape is a defect in the middle of a review session.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
    "httpx2==2.13.0",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[tool.ruff.lint]
# Explicit, because ruff's default set covers E and F but not I, D or ANN.
# Import ordering, docstrings and annotations were each previously unenforced.
select = ["E", "F", "I", "D", "ANN"]

# D203/D211 and D212/D213 are mutually exclusive BY CONSTRUCTION -- selecting `D`
# whole enables both halves of each pair, and ruff resolves them itself with a
# warning on every run. Choosing explicitly silences that warning and, more to the
# point, makes the choice reviewable. Both picks match what the code already does:
# D211 (no blank line before a class docstring) and D212 (multi-line summary starts
# on the first line). This is the only blanket `ignore` in the file.
ignore = ["D203", "D213"]

# Declared rather than inferred. ruff's isort decides first-party per SUBMODULE by
# asking whether the path exists on disk, so once `isekai/pipeline/` became a
# package directory the archived probe's single import block split across two
# sections -- `isekai.pipeline` resolved, `isekai.comfy_client` and
# `isekai.workflow` (deleted at v0.14) did not -- and I001 fired on a file that had
# not been touched since v0.10. Naming the package states the fact directly, so
# classification no longer depends on what happens to exist in the tree today.
#
# This is NOT a suppression, and deliberately not one: an archived change records
# code that was true at a past commit and is never repaired, so the alternative was
# either editing the archive -- which would falsify the record it exists to be --
# or exempting a rule. Neither was needed.
[tool.ruff.lint.isort]
known-first-party = ["isekai"]

[tool.ruff.lint.per-file-ignores]
# Tests are named as behavioural sentences and double as documentation -- that is
# this repo's stated convention, and the name IS the description. A docstring
# restating `test_unknown_model_exits_with_a_legible_message` adds nothing and rots
# separately from the name. So "missing docstring" (D1xx) is waived, HERE ONLY.
#
# Deliberately NOT waived for tests: the D2xx/D4xx style rules, so a docstring that
# IS written must still be well-formed; and all of ANN, because a wrong fixture
# annotation is a real defect and `-> None` on a test is nearly free.
"tests/*" = ["D1"]

# `eval_backends.py` is the ONLY module that touches numpy, torch, onnxruntime
# and Pillow, and it exists to be that boundary -- everything the scorer decides
# lives in `isekai/evaluation/evaluate.py`, which is stdlib-only and fully annotated. An
# ndarray has no honest annotation available here: the extra is NOT installed in
# the environment the gate runs in, by design, so `numpy.typing.NDArray` cannot
# be resolved even behind `TYPE_CHECKING` -- the type checker would fail on the
# import it cannot find.
#
# So ANN401 is waived HERE ONLY, and for that one rule. Every other ANN rule
# still applies, so an unannotated argument in this file is still an error; what
# is waived is the demand for a more specific type than the environment can name.
"isekai/evaluation/eval_backends.py" = ["ANN401"]

# `scripts/` is operator tooling rather than a package, so nothing imports it by
# installation. Declaring it a source root here lets the type checker and the
# suite see `derive_manifest` the way a human running it does. It widens where
# real code is looked for; it suppresses no check.
# Three files bridge to packages the gate's environment deliberately does NOT
# install, so `unresolved-import` in them is the configuration working, not a
# defect: `eval_backends.py`, the scorer's model boundary; `wd14.py`, the local
# tagger's, which is the ONLY file in the package that touches the `tagging`
# extra and touches it function-locally; and `build_contact_sheets.py`, a
# labelling aid that needs Pillow to paste three images side by side. Scoped to those files and to that one rule -- every other
# check still applies, which is how the `invalid-return-type` on
# `OnnxSession.run` was caught and fixed rather than suppressed.
#
# Scoped as an override rather than as per-line `ty: ignore` comments, because
# those cannot be right in both environments: absent the extra they are load-
# bearing, and present it they are "unused directive" warnings, and ty exits
# non-zero on warnings. An override is green whether or not the extra is
# installed, which is the property that matters -- `make gate` must not depend on
# what the operator happens to have synced.
[[tool.ty.overrides]]
include = [
    "isekai/evaluation/eval_backends.py",
    "isekai/boundary/wd14.py",
    "baseline/build_contact_sheets.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# The archive's one and only `.py` file, in a block of its own because its reason
# is not the block above's. An archived change records code that was true at a
# past commit; these rules ask whether it is true TODAY, which the archive makes
# no claim about. The exemption is PERMANENT -- the probe is never repaired,
# because "archived changes are never deleted", and editing it to match today's
# tree would falsify the record it exists to be. Listed by literal path rather
# than a `**` glob over the archive, so no file nobody has written yet is granted
# cover in advance; and kept out of the block above, which means exactly "files
# that bridge to wheels the gate deliberately does not install" and has no claim
# to cover against type errors (design.md D5, as corrected in phase 3).
[[tool.ty.overrides]]
include = ["openspec/changes/archive/0010-illustrious-base/controlnet_probe.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"

[tool.ty.environment]
extra-paths = ["scripts"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
# Registration is load-bearing, not bookkeeping: pytest silently ignores an
# unregistered marker, so an unregistered `spec` would bind nothing while
# looking exactly like a binding.
markers = [
    "spec(key): binds this test to a keyed scenario in openspec/specs/",
    "spec_exempt(reason): declares this test structural — it proves no scenario",
]
