[project]
name = "isekai"
version = "0.22.8"
requires-python = ">=3.12"
# **What running a flow needs, declared rather than optional.** This list was
# empty until v0.22.3, held by the `-S` guard in `tests/test_pipeline_cli.py`,
# and the claim it carried -- *the runtime is stdlib-only* -- was retired because
# the environment kept disagreeing with it. `uv sync` makes the environment match
# exactly what it is told and REMOVES extras it is not told about, and the gate's
# first command is `uv sync --locked` with no `--extra`: the gate was uninstalling
# the local tagger on every run, which is why `uv sync --extra tagging` kept
# looking like a command an operator had to repeat.
#
# `[tool.uv] default-extras` would have silenced that and kept `dependencies = []`
# literally true, but only inside a test -- every real checkout would carry 2 GB of
# onnxruntime while the manifest said it needed nothing. The local tagger runs on
# every `caption` for every flow, so *"optional"* was false in the plainest sense
# (design.md D3).
#
# **The narrower claim survives, and it is the one the architecture rests on: the
# entry point imports no third-party package at MODULE SCOPE.** `wd14.py`'s
# onnxruntime, numpy and Pillow imports are function-local by design, and
# `interface/ui/__init__.py` keeps FastAPI off `python -m isekai`'s import graph
# the same way. That is why `isekai show` works on a checkout that has provisioned
# nothing, and the `-S` guard now proves *it* -- a job that matters more, not less,
# now that the packages are installed by default and nothing else would fail when
# a module-scope import appears (design.md D4).
#
# **Pinned exactly, at what `uv.lock` resolved.** The lock pins this checkout; this
# list is what a second machine resolves against, and the tagger's output feeds
# every sheet while the surface is where a sheet is corrected.
#
#   onnxruntime -- the SwinV2 session `models/wd14/model.onnx` is loaded through.
#   numpy       -- the prepared array in and the probability vector out.
#   Pillow      -- open, composite onto white, pad to a square, resize.
#   fastapi     -- the review surface's server, bound to 127.0.0.1.
#   uvicorn     -- what runs it.
#
# `fastapi[standard]` is deliberately not used: it would pull a much wider tree --
# an HTTP client, a CLI, email validation, templating -- for one loopback server
# that serves a JSON API and a built bundle.
dependencies = [
    "onnxruntime==1.29.0",
    "numpy==2.5.3",
    "Pillow==12.3.0",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

# The evaluator's stack, and the only thing left that is genuinely optional. It is
# the scorer, not a way to render: `eval` measures a cohort after the fact, so a
# checkout that never scores anything should not carry `torch`.
#
# CI never installs this. The eval tests run there without it, because they
# import the stdlib-only rules and fakes and never `eval_backends.py`; the models
# themselves are judged by eye, as diffusion quality is. This extra adds no
# gate command -- and none of the gate's commands installs it, which is
# exactly the mechanism that used to strip the tagger and now cannot.
#
# **It names only what it adds.** `torch` and `transformers` -- StyleID publishes
# only a CLIPModel safetensors, and the DWPose artifact `models.json` pins is a
# TorchScript `.pt`, so there is no ONNX route to either and this is not a
# convenience. The scorer also reaches `onnxruntime` (the region parser and the
# anime-face detector; loading weights is not linking code, which is what keeps
# the detector's copyleft question closed -- design.md D19), `numpy` and `Pillow`
# (arrays, and the loader's orientation transpose) -- and it no longer floors any
# of those three, because `dependencies` above pins them for every checkout.
#
# **Re-floor them here and the drift is back.** Two lists naming one package is
# the shape v0.22.3 deleted between the `ui` extra and the `dev` group; a floor
# here beside a pin above would be the same defect wearing the other hat, and
# `tests/test_packaging.py` fails on it rather than leaving it to review.
#
# Deliberately absent: `ultralytics`, asserted by a test rather than left to a
# licence review nobody runs. `scipy`/`scikit-image` are absent too -- CIEDE2000
# and Spearman are closed-form, are implemented in-tree against their published
# formulas, and are unit-tested against published reference data.
[project.optional-dependencies]
eval = [
    "torch>=2.6",
    "transformers>=4.49",
]

# Test and gate tooling only, and NOT runtime: `uv sync --locked` installs this
# group by default, so everything here is present for all six gate commands and
# for none of `python -m isekai`.
#
# `httpx2` is what starlette's `TestClient` requires -- a test client, not a
# server dependency, which is why it is here and not beside `fastapi` above.
#
# **`fastapi` and `uvicorn` used to be duplicated here**, because they lived only
# in a `ui` extra that gate command one never installed: `tests/test_ui_api.py`'s
# `importorskip` fired, and four `ui` scenarios bound only there were proved by a
# test that never ran -- a binding that looks exactly like a binding and binds
# nothing. v0.22.3 made both required instead, so the duplication has nothing left
# to repair and is gone; the gate installs them because the project declares them.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
    "httpx2==2.13.0",
]

[tool.ruff.lint]
# Explicit, because ruff's default set covers E and F but not I, D or ANN.
# Import ordering, docstrings and annotations were each previously unenforced.
select = ["E", "F", "I", "D", "ANN"]

# D203/D211 and D212/D213 are mutually exclusive BY CONSTRUCTION -- selecting `D`
# whole enables both halves of each pair, and ruff resolves them itself with a
# warning on every run. Choosing explicitly silences that warning and, more to the
# point, makes the choice reviewable. Both picks match what the code already does:
# D211 (no blank line before a class docstring) and D212 (multi-line summary starts
# on the first line). This is the only blanket `ignore` in the file.
ignore = ["D203", "D213"]

# Declared rather than inferred. ruff's isort decides first-party per SUBMODULE by
# asking whether the path exists on disk, so once `isekai/pipeline/` became a
# package directory the archived probe's single import block split across two
# sections -- `isekai.pipeline` resolved, `isekai.comfy_client` and
# `isekai.workflow` (deleted at v0.14) did not -- and I001 fired on a file that had
# not been touched since v0.10. Naming the package states the fact directly, so
# classification no longer depends on what happens to exist in the tree today.
#
# This is NOT a suppression, and deliberately not one: an archived change records
# code that was true at a past commit and is never repaired, so the alternative was
# either editing the archive -- which would falsify the record it exists to be --
# or exempting a rule. Neither was needed.
[tool.ruff.lint.isort]
known-first-party = ["isekai", "tools", "evaluation"]

[tool.ruff.lint.per-file-ignores]
# Tests are named as behavioural sentences and double as documentation -- that is
# this repo's stated convention, and the name IS the description. A docstring
# restating `test_unknown_model_exits_with_a_legible_message` adds nothing and rots
# separately from the name. So "missing docstring" (D1xx) is waived, HERE ONLY.
#
# Deliberately NOT waived for tests: the D2xx/D4xx style rules, so a docstring that
# IS written must still be well-formed; and all of ANN, because a wrong fixture
# annotation is a real defect and `-> None` on a test is nearly free.
"tests/*" = ["D1"]

# `eval_backends.py` is the ONLY module that touches numpy, torch, onnxruntime
# and Pillow, and it exists to be that boundary -- everything the scorer decides
# lives in `evaluation/evaluate.py`, which is stdlib-only and fully annotated.
# The values this file hands around come out of `torch` and `transformers` as
# well as `numpy`, and the `[eval]` extra that carries those two is NOT installed
# in the environment the gate runs in, by design, so their types cannot be named
# even behind `TYPE_CHECKING` -- the type checker would fail on the import it
# cannot find. (`numpy` itself resolves since v0.22.3 made it a declared
# dependency; that alone does not name a tensor.)
#
# So ANN401 is waived HERE ONLY, and for that one rule. Every other ANN rule
# still applies, so an unannotated argument in this file is still an error; what
# is waived is the demand for a more specific type than the environment can name.
"evaluation/eval_backends.py" = ["ANN401"]

# One file bridges to packages the gate's environment deliberately does NOT
# install, so `unresolved-import` in it is the configuration working, not a
# defect: `eval_backends.py`, the scorer's model boundary, over the `[eval]`
# extra. `wd14.py` and `build_contact_sheets.py` were listed here while the
# tagger's stack and Pillow were optional; v0.22.3 made them declared
# dependencies, so their imports resolve and they have no claim to this cover.
# Scoped to that file and to that one rule -- every other check still applies,
# which, while `wd14.py` was listed, is how the `invalid-return-type` on
# `OnnxSession.run` was caught and fixed rather than suppressed.
#
# Scoped as an override rather than as per-line `ty: ignore` comments, because
# those cannot be right in both environments: absent the extra they are load-
# bearing, and present it they are "unused directive" warnings, and ty exits
# non-zero on warnings. An override is green whether or not the extra is
# installed, which is the property that matters -- `make gate` must not depend on
# what the operator happens to have synced.
[[tool.ty.overrides]]
include = ["evaluation/eval_backends.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# The archive's one and only `.py` file, in a block of its own because its reason
# is not the block above's. An archived change records code that was true at a
# past commit; these rules ask whether it is true TODAY, which the archive makes
# no claim about. The exemption is PERMANENT -- the probe is never repaired,
# because "archived changes are never deleted", and editing it to match today's
# tree would falsify the record it exists to be. Listed by literal path rather
# than a `**` glob over the archive, so no file nobody has written yet is granted
# cover in advance; and kept out of the block above, which means exactly "files
# that bridge to wheels the gate deliberately does not install" and has no claim
# to cover against type errors (design.md D5, as corrected in phase 3).
[[tool.ty.overrides]]
include = ["openspec/changes/archive/0010-illustrious-base/controlnet_probe.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Registration is load-bearing, not bookkeeping: pytest silently ignores an
# unregistered marker, so an unregistered `spec` would bind nothing while
# looking exactly like a binding.
markers = [
    "spec(key): binds this test to a keyed scenario in openspec/specs/",
    "spec_exempt(reason): declares this test structural — it proves no scenario",
]
