[project]
name = "isekai"
version = "0.12.0"
requires-python = ">=3.12"
dependencies = []

# The evaluator's stack, and NOT the runtime's. `convert.py` keeps
# `dependencies = []` above, held by a test that imports it with site-packages
# off the path -- an evaluator is not a second way to render, and the one-path
# rule is about rendering (design.md D12).
#
# CI never installs this. The eval tests skip there and run on the operator's
# machine, which is the same posture this repository already takes toward
# diffusion quality: verified by eye on a pod, never in CI. The gate array stays
# five commands.
#
# Five packages, and each one is load-bearing:
#   torch, transformers -- StyleID publishes only a CLIPModel safetensors, and
#     the DWPose artifact `models.json` pins is a TorchScript `.pt`. There is no
#     ONNX route to either, so this is not a convenience.
#   onnxruntime -- MIT, and what the region parser and the anime-face detector
#     are loaded through. Loading weights is not linking code, which is what
#     keeps the detector's copyleft question closed (design.md D19).
#   numpy, Pillow -- arrays, and the loader's orientation transpose. The header
#     parser returns dimensions; the scorer has to transpose the pixels itself.
#
# Deliberately absent: `ultralytics`, asserted by a test rather than left to a
# licence review nobody runs. `scipy`/`scikit-image` are absent too -- CIEDE2000
# and Spearman are closed-form, are implemented in-tree against their published
# formulas, and are unit-tested against published reference data.
[project.optional-dependencies]
eval = [
    "torch>=2.6",
    "transformers>=4.49",
    "onnxruntime>=1.20",
    "numpy>=2.1",
    "Pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[tool.ruff.lint]
# Explicit, because ruff's default set covers E and F but not I, D or ANN.
# Import ordering, docstrings and annotations were each previously unenforced.
select = ["E", "F", "I", "D", "ANN"]

# D203/D211 and D212/D213 are mutually exclusive BY CONSTRUCTION -- selecting `D`
# whole enables both halves of each pair, and ruff resolves them itself with a
# warning on every run. Choosing explicitly silences that warning and, more to the
# point, makes the choice reviewable. Both picks match what the code already does:
# D211 (no blank line before a class docstring) and D212 (multi-line summary starts
# on the first line). This is the only blanket `ignore` in the file.
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# Tests are named as behavioural sentences and double as documentation -- that is
# this repo's stated convention, and the name IS the description. A docstring
# restating `test_unknown_model_exits_with_a_legible_message` adds nothing and rots
# separately from the name. So "missing docstring" (D1xx) is waived, HERE ONLY.
#
# Deliberately NOT waived for tests: the D2xx/D4xx style rules, so a docstring that
# IS written must still be well-formed; and all of ANN, because a wrong fixture
# annotation is a real defect and `-> None` on a test is nearly free.
"tests/*" = ["D1"]

# `eval_backends.py` is the ONLY module that touches numpy, torch, onnxruntime
# and Pillow, and it exists to be that boundary -- everything the scorer decides
# lives in `isekai/evaluate.py`, which is stdlib-only and fully annotated. An
# ndarray has no honest annotation available here: the extra is NOT installed in
# the environment the gate runs in, by design, so `numpy.typing.NDArray` cannot
# be resolved even behind `TYPE_CHECKING` -- the type checker would fail on the
# import it cannot find.
#
# So ANN401 is waived HERE ONLY, and for that one rule. Every other ANN rule
# still applies, so an unannotated argument in this file is still an error; what
# is waived is the demand for a more specific type than the environment can name.
"isekai/eval_backends.py" = ["ANN401"]

# `scripts/` is operator tooling rather than a package, so nothing imports it by
# installation. Declaring it a source root here lets the type checker and the
# suite see `derive_manifest` the way a human running it does. It widens where
# real code is looked for; it suppresses no check.
# Two files bridge to packages the gate's environment deliberately does NOT
# install, so `unresolved-import` in them is the configuration working, not a
# defect: `eval_backends.py`, the scorer's model boundary, and
# `build_contact_sheets.py`, a labelling aid that needs Pillow to paste three
# images side by side. Scoped to those files and to that one rule -- every other
# check still applies, which is how the `invalid-return-type` on
# `OnnxSession.run` was caught and fixed rather than suppressed.
#
# Scoped as an override rather than as per-line `ty: ignore` comments, because
# those cannot be right in both environments: absent the extra they are load-
# bearing, and present it they are "unused directive" warnings, and ty exits
# non-zero on warnings. An override is green whether or not the extra is
# installed, which is the property that matters -- `make gate` must not depend on
# what the operator happens to have synced.
[[tool.ty.overrides]]
include = ["isekai/eval_backends.py", "baseline/build_contact_sheets.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.ty.environment]
extra-paths = ["scripts"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
# Registration is load-bearing, not bookkeeping: pytest silently ignores an
# unregistered marker, so an unregistered `spec` would bind nothing while
# looking exactly like a binding.
markers = [
    "spec(key): binds this test to a keyed scenario in openspec/specs/",
    "spec_exempt(reason): declares this test structural — it proves no scenario",
]
